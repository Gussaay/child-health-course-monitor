name: One-off - ETAT course, link videos in place (keeps learner progress)
# Runs scripts/course-lesson-update/update-lessons.cjs for the etat course with the mode in
# scripts/etat-upload/video-mode.txt (dry = read only, commit = write, undo = put back).
on:
  push:
    branches: [claude/project-thread-uunwaz]
    paths: ['scripts/etat-upload/video-mode.txt', 'course-packages/sudan-etat-training.imnci.json', '.github/workflows/etat-video-link.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --ignore-scripts firebase-admin@13
        working-directory: scripts/course-lesson-update
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}
        working-directory: scripts/course-lesson-update
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/key.json"
          MODE=$(tr -d '[:space:]' < ../etat-upload/video-mode.txt)
          FLAG=""; [ "$MODE" = commit ] && FLAG=--commit; [ "$MODE" = undo ] && FLAG=--undo
          echo "Mode: ${MODE}"
          KEY_FILE="$RUNNER_TEMP/key.json" node update-lessons.cjs etat $FLAG
