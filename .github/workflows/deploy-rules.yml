name: Deploy Firestore and Storage rules

# One-off: deploys firestore.rules and storage.rules after the rules tests
# pass. Runs only for pushes to this branch, so it never touches the main
# deploy. (Last used for the Child Health Library: libraryItems and library/.)
on:
  push:
    branches:
      - claude/funny-knuth-m7nuu1

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: npm ci --ignore-scripts
      - name: Firestore rules tests
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project imnci-courses-monitor-test "npx vitest run --config vitest.rules.config.js"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}'
      - name: Deploy Firestore and Storage rules
        run: npx --yes firebase-tools@13 deploy --only firestore:rules,storage --project imnci-courses-monitor --non-interactive
