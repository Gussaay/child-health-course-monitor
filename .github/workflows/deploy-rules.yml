name: Apply Storage CORS

# One-off: applies cors.json to the Storage bucket so the app can download
# course pictures for "Save for offline". Runs only for pushes to this branch.
on:
  push:
    branches:
      - claude/project-thread-fjukxi

jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply CORS
        run: |
          gcloud storage buckets update gs://imnci-courses-monitor.firebasestorage.app --cors-file=cors.json
          gcloud storage buckets describe gs://imnci-courses-monitor.firebasestorage.app --format="default(cors_config)"
