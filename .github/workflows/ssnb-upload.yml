name: One-off - Sick & Small Newborn courses upload
# Runs scripts/ssnb-upload/upload-ssnb.cjs for each course in courses.txt (m1 m2 m3) with the mode in mode.txt
# (dry = read only, commit = write, replace = swap the uploaded lessons for the file's, undo = remove what was written).
on:
  push:
    branches: [claude/peaceful-carson-1mky1n]
    paths: ['scripts/ssnb-upload/upload-ssnb.cjs', 'scripts/ssnb-upload/mode.txt', 'scripts/ssnb-upload/courses.txt', 'scripts/ssnb-upload/figures/**', 'course-packages/ssnb-*.imnci.json', '.github/workflows/ssnb-upload.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --ignore-scripts firebase-admin@13
        working-directory: scripts/ssnb-upload
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}
        working-directory: scripts/ssnb-upload
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/key.json"
          MODE=$(tr -d '[:space:]' < mode.txt)
          FLAG=""; [ "$MODE" = commit ] && FLAG=--commit; [ "$MODE" = undo ] && FLAG=--undo; [ "$MODE" = replace ] && FLAG=--replace
          echo "Mode: ${MODE}"
          for C in $(cat courses.txt); do
            echo "================ Course ${C} ================"
            KEY_FILE="$RUNNER_TEMP/key.json" node upload-ssnb.cjs --course "$C" $FLAG
          done
