name: One-off - Sudan IMNCI classic course upload
# Runs scripts/imnci-classic-upload/upload-classic.cjs with the mode in mode.txt
# (dry = read only, commit = write, replace = swap the uploaded lessons for the file's, undo = remove what was written).
on:
  push:
    branches: [claude/project-thread-h8n9e8, claude/project-thread-cjzso2]
    paths: ['scripts/imnci-classic-upload/**', 'course-packages/sudan-imnci-classic-modules-1-3.imnci.json', '.github/workflows/imnci-classic-upload.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --ignore-scripts firebase-admin@13
        working-directory: scripts/imnci-classic-upload
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}
        working-directory: scripts/imnci-classic-upload
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/key.json"
          MODE=$(tr -d '[:space:]' < mode.txt)
          FLAG=""; [ "$MODE" = commit ] && FLAG=--commit; [ "$MODE" = undo ] && FLAG=--undo; [ "$MODE" = replace ] && FLAG=--replace
          echo "Mode: ${MODE}"
          KEY_FILE="$RUNNER_TEMP/key.json" node upload-classic.cjs $FLAG
