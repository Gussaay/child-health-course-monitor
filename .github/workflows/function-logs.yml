name: Read function logs

# One-off, read-only diagnosis of the AI functions: recent log lines, and
# whether the Gemini and Groq keys answer (status codes and model names only;
# the keys are masked and never printed). Runs on this branch only.
on:
  push:
    branches:
      - claude/project-thread-je2fp1

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}'
      - uses: google-github-actions/setup-gcloud@v2
      - name: AI function log lines (last 6 hours)
        run: |
          gcloud logging read '(resource.labels.service_name="aiassistant" OR resource.labels.service_name="aibooks") AND (textPayload:"aiAssistant" OR jsonPayload.message:"aiAssistant")' \
            --project imnci-courses-monitor --freshness=3h --limit=200 --format=json \
            | jq -r '.[] | "\(.timestamp) \(.severity) \((.textPayload // .jsonPayload.message // "") | .[0:400])"' || true
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-jfo8r7
          path: app
      - name: Whole-app questions from the Courses page on Groq, with the real key
        shell: bash
        run: |
          set +e
          export Q=$(gcloud secrets versions access latest --secret=GROQ_API_KEY --project imnci-courses-monitor | tr -d ' \n"'"'"'')
          echo "::add-mask::$Q"
          cd app/functions && npm ci --ignore-scripts --no-audit --no-fund >/dev/null 2>&1
          cat > /tmp/run.cjs <<'JS'
          const { askChat, SIZES } = require(process.cwd() + "/aiChat.js");
          const { systemFor } = require(process.cwd() + "/aiDataText.js");
          const { readReference } = require(process.cwd() + "/aiReference.js");
          const { GROQ_MODELS } = require(process.cwd() + "/aiModels.js");
          const catalogue = ["courses", "participants", "healthFacilities", "facilitators", "skillMentorship"].map((c) => ({ collection: c, label: c, fields: [] }));
          const page = { title: "Courses", place: "National Child Health Program – Courses", view: "courses", text: "Courses list IMNCI ETAT EENC ".repeat(40) };
          const system = systemFor({ page, lang: "ar", pageChars: SIZES.groq.page, catalogue });
          const reads = [];
          const call = async (name, args) => { reads.push(name + " " + JSON.stringify(args)); return name === "read_reference" ? readReference(args) : { note: "no data in this test" }; };
          const run = async (q) => {
            const t0 = Date.now(); reads.length = 0;
            try {
              const out = await askChat({ provider: "groq", key: process.env.Q, models: GROQ_MODELS, system, history: [], question: q, call, deadline: Date.now() + 90000 });
              console.log("ANSWERED by", out.model, "in", Math.round((Date.now() - t0) / 1000), "s | reads:", reads.join(" ; "), "|", String(out.text).replace(/\n/g, " ").slice(0, 700));
            } catch (e) { console.log("FAILED after", Math.round((Date.now() - t0) / 1000), "s:", e.message, reads.join(" ; ")); }
          };
          (async () => {
            await run("قارن انتشار الإسهال والالتهاب الرئوي بين MICS 2014 و S3M 2018 على المستوى الوطني وفي ولاية القضارف");
            await run("Which localities of Gedaref have the lowest Penta3 coverage in S3M, and how has under-five mortality changed since 2015?");
          })();
          JS
          node /tmp/run.cjs 2>&1 | grep -E "replied|step|waiting|ANSWERED|FAILED|429|413|without|empty|system chars" | sed -E 's/\{"severity":"[A-Z]+","message":"//; s/"\}$//' | head -60
