name: Read function logs

# One-off, read-only diagnosis of the AI functions: recent log lines, and
# whether the Gemini and Groq keys answer (status codes and model names only;
# the keys are masked and never printed). Runs on this branch only.
on:
  push:
    branches:
      - claude/project-thread-je2fp1

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}'
      - uses: google-github-actions/setup-gcloud@v2
      - name: AI function log lines (last 6 hours)
        run: |
          gcloud logging read '(resource.labels.service_name="aiassistant" OR resource.labels.service_name="aibooks") AND (textPayload:"aiAssistant" OR jsonPayload.message:"aiAssistant")' \
            --project imnci-courses-monitor --freshness=3h --limit=200 --format=json \
            | jq -r '.[] | "\(.timestamp) \(.severity) \((.textPayload // .jsonPayload.message // "") | .[0:400])"' || true
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-jfo8r7
          path: app
      - name: A 4-step question on Groq alone, with the real key
        shell: bash
        run: |
          set +e
          export Q=$(gcloud secrets versions access latest --secret=GROQ_API_KEY --project imnci-courses-monitor | tr -d ' \n"'"'"'')
          echo "::add-mask::$Q"
          cd app/functions && npm ci --ignore-scripts --no-audit --no-fund >/dev/null 2>&1
          cat > /tmp/run.cjs <<'JS'
          const { askChat } = require(process.cwd() + "/aiChat.js");
          const { systemFor } = require(process.cwd() + "/aiDataText.js");
          const { GROQ_MODELS } = require(process.cwd() + "/aiModels.js");
          const catalogue = ["courses", "participants", "healthFacilities", "facilitators"].map((c) => ({ collection: c, label: c, fields: [] }));
          let system;
          try { system = systemFor({ page: { text: "الولاية المحلية ".repeat(150), view: "dashboard" }, lang: "ar", pageChars: 3000, catalogue }); } catch (e) { system = "You answer from the app data only. " + "rules ".repeat(2500); }
          let n = 0;
          const call = async (name, args) => { n++; const g = args.groupBy || "الولاية"; return { collection: args.collection, groupBy: g, total: 1800, groups: Array.from({ length: 60 }, (_, i) => ({ [g]: g + " " + (i + 1), count: 10 + i * 3, ...(args.valueField ? { sum: i * 7 } : {}) })) }; };
          (async () => {
            const t0 = Date.now();
            try {
              const out = await askChat({ provider: "groq", key: process.env.Q, models: GROQ_MODELS, system, history: [],
                question: "عدد المؤسسات الصحية والأطباء في كل ولاية، ثم في كل محلية، ثم عدد الكورسات في كل ولاية، ثم المشاركين حسب المسمى الوظيفي. استخدم أداة منفصلة لكل جزء.",
                call, deadline: Date.now() + 90000 });
              console.log("ANSWERED by", out.model, "in", Math.round((Date.now() - t0) / 1000), "s with", n, "reads; tooManySteps:", !!out.tooManySteps, "|", String(out.text).slice(0, 200));
            } catch (e) { console.log("FAILED after", Math.round((Date.now() - t0) / 1000), "s with", n, "reads:", e.message); }
          })();
          JS
          node /tmp/run.cjs 2>&1 | grep -E "replied|step|waiting|ANSWERED|FAILED|429" | sed -E 's/\{"severity":"[A-Z]+","message":"//; s/"\}$//' | head -60
