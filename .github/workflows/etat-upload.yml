name: One-off - Sudan ETAT course upload
# Runs scripts/etat-upload/upload-etat.cjs with the mode in mode.txt
# (dry = read only, commit = write, replace = swap the uploaded lessons for the file's, undo = remove what was written).
on:
  push:
    branches: [claude/project-thread-uunwaz, claude/project-thread-hlzu8z]
    paths: ['scripts/etat-upload/upload-etat.cjs', 'scripts/etat-upload/mode.txt', 'scripts/etat-upload/figures/**', 'course-packages/sudan-etat-training.imnci.json', '.github/workflows/etat-upload.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --ignore-scripts firebase-admin@13
        working-directory: scripts/etat-upload
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}
        working-directory: scripts/etat-upload
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/key.json"
          MODE=$(tr -d '[:space:]' < mode.txt)
          FLAG=""; [ "$MODE" = commit ] && FLAG=--commit; [ "$MODE" = undo ] && FLAG=--undo; [ "$MODE" = replace ] && FLAG=--replace
          echo "Mode: ${MODE}"
          KEY_FILE="$RUNNER_TEMP/key.json" node upload-etat.cjs $FLAG
