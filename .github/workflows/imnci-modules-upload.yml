name: One-off - IMNCI distance learning modules upload
# Runs scripts/imnci-modules-upload/upload-modules.cjs with the mode in mode.txt
# and the facilitator guide with the mode in guide-mode.txt
# (dry = read only, commit = write, replace = swap the uploaded lessons for the file's, undo = remove what was written).
on:
  push:
    branches: [claude/project-thread-v7irb4]
    paths: ['scripts/imnci-modules-upload/**', '.github/workflows/imnci-modules-upload.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --ignore-scripts firebase-admin@13
        working-directory: scripts/imnci-modules-upload
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}
        working-directory: scripts/imnci-modules-upload
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/key.json"
          MODE=$(tr -d '[:space:]' < mode.txt)
          FLAG=""; [ "$MODE" = commit ] && FLAG=--commit; [ "$MODE" = undo ] && FLAG=--undo; [ "$MODE" = replace ] && FLAG=--replace
          echo "Mode: ${MODE}"
          KEY_FILE="$RUNNER_TEMP/key.json" node upload-modules.cjs $FLAG
          GMODE=$(tr -d '[:space:]' < guide-mode.txt)
          GFLAG=""; [ "$GMODE" = commit ] && GFLAG=--commit; [ "$GMODE" = undo ] && GFLAG=--undo; [ "$GMODE" = replace ] && GFLAG=--replace
          echo; echo "=== Facilitator guide. Mode: ${GMODE}"
          KEY_FILE="$RUNNER_TEMP/key.json" node upload-modules.cjs --guide $GFLAG
