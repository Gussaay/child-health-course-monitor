name: One-off - Read usage check (read only)
on:
  push:
    branches: [claude/project-thread-7ednkh]
    paths: ['scripts/read-usage-check/**', '.github/workflows/read-usage-check.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --ignore-scripts firebase-admin@13
        working-directory: scripts/read-usage-check
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMNCI_COURSES_MONITOR }}
        working-directory: scripts/read-usage-check
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/key.json"
          KEY_FILE="$RUNNER_TEMP/key.json" node inspect.cjs
