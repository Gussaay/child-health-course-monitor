<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    
    <!-- maximum-scale/user-scalable were removed: blocking pinch-zoom fails WCAG
         1.4.4 and hurts exactly the people who need it most — anyone reading
         dense Arabic tables on a small phone. They are usually set to stop iOS
         zooming when an input is focused, which a 16px input font size fixes
         instead (see index.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="National Child Health Program - Monitoring System" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <script>
      (function () {
        try {
          var p = localStorage.getItem('themePref');
          var dark = p === 'dark' || ((p !== 'light') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
        } catch (e) {}
      })();
    </script>
    <title>Child Health Program Monitoring System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
